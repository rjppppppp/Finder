name: 🐛 Bug Report
description: Report an issue or bug with Finder
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please provide as much detail as possible.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Tell us what went wrong...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this bug?
      placeholder: |
        1. Open Finder with Alt + Space
        2. Type query...
        3. See error...
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Windows Version
      options:
        - Windows 11 (23H2 / 24H2)
        - Windows 11 (22H2 or older)
        - Windows 10 (22H2 / 21H2)
        - Other
    validations:
      required: true
